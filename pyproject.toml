[project]
name = "chrome-history-mcp"
version = "0.1.0"
description = "MCP server that exposes Chrome browsing history to LLMs via read-only SQL queries against a lock-safe snapshot."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Kyle Taylor" },
]
keywords = ["mcp", "chrome", "history", "sqlite", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.12.1",
]

[project.urls]
Homepage = "https://github.com/kyletaylored/chrome-history-mcp"
Issues = "https://github.com/kyletaylored/chrome-history-mcp/issues"

[project.scripts]
chrome-history-mcp = "chrome_history_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "poethepoet>=0.30",
    "pytest>=8.0",
    "ruff>=0.12.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chrome_history_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.poe.tasks.test]
help = "Run the pytest suite"
cmd = "pytest"

[tool.poe.tasks.lint]
help = "Lint with ruff"
cmd = "ruff check ."

[tool.poe.tasks.fmt]
help = "Auto-format with ruff"
cmd = "ruff format ."

[tool.poe.tasks.dev]
help = "Run the MCP server with verbose stderr logging (for manual stdio probing)"
cmd = "chrome-history-mcp --verbose"

[tool.poe.tasks.inspect]
help = "Launch the MCP Inspector against this server (requires Node.js / npx)"
cmd = "npx @modelcontextprotocol/inspector --config mcp-inspector.json --server chrome-history"

[tool.poe.tasks.install-cc]
help = "Register this server with Claude Code (local scope)"
shell = "claude mcp add chrome-history -- uv run --directory \"$PWD\" chrome-history-mcp"

[tool.poe.tasks.pack]
help = "Build the .dxt extension bundle (requires the dxt CLI: npm i -g @anthropic-ai/dxt)"
cmd = "dxt pack"
